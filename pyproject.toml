[project]
name = "zipka"
version = "0.1.0"
description = "Зипка — локальный саморазвивающийся агент на Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "opencv-python>=4.10.0",
  "sounddevice>=0.5.0",
  "numpy>=1.26.0",
  "faster-whisper>=1.0.3",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
]

[project.scripts]
zipka = "zipka.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zipka*"]
